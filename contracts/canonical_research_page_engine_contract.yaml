contract_name: canonical_research_page_engine_contract
contract_version: 1
owner_surface: Hunt Research Page
status: validator_populated
audit_output_root: audits/research_page_canonical_contract

scope:
  controls:
    - Research Page public/runtime data feed
    - prediction-engine feeder eligibility for research display
    - scorable truth coverage
    - website metric display mapping
  explicitly_not_controlled:
    - Hunt Builder / Hunt Planner entry-page flow
    - split boundary delivery files
    - GeoJSON/KML boundary rebuilds
    - production promotion

identity:
  primary_display_key: hunt_code
  canonical_research_key:
    - hunt_code
    - target_year_or_actual_draw_year
    - engine_family
    - residency_when_applicable
    - point_level_when_applicable
    - draw_pool_when_applicable
  rule: hunt_code alone is not a prediction-engine primary key.

truth_sources:
  canonical_draw_truth:
    glob: data_truth/draw_results_truth/normalized/canonical_yearly/*.csv
    usable_as_actual_truth: true
    notes: Official normalized yearly draw-result truth is the only actual draw truth input.
  reference_database:
    path: pipeline/RAW/hunt_unit_database/2026/csv/DATABASE.csv
    usable_as_actual_truth: false
    notes: Current hunt/reference universe; not actual draw-result truth.

research_page_sources:
  public_research_index:
    path: processed_data/hunt_research_2026_split/hunt_research_2026.index.json
  public_research_summary:
    path: processed_data/hunt_research_2026_summary.json
  public_research_details_bundle:
    path: processed_data/hunt_research_2026_split/hunt_research_2026.details.json
  preferred_ladder_json:
    path: processed_data/hunt_research_2026_ladder.json
    optional: true
  existing_preference_ladder_json:
    path: processed_data/hunt_research_2026_ladder_preference.json
    optional: true

engine_feeders:
  observed_engine:
    - processed_data/draw_reality_engine.csv
    - processed_data/draw_reality_engine_v2.csv
  predictive_engine:
    - processed_data/draw_reality_engine_predictive_v2.csv
  point_ladder:
    - processed_data/point_ladder_view.csv
  master:
    - processed_data/hunt_master_enriched.csv
  reference:
    - processed_data/hunt_unit_reference_linked.csv

engine_families:
  - PREFERENCE_DRAW
  - BONUS_SPLIT_DRAW
  - YOUTH_RANDOM
  - AVAILABILITY_ONLY
  - OTC_CAPPED
  - OTC_UNLIMITED
  - DIRECT_ALLOCATION
  - HARVEST_FEATURE
  - POINT_LADDER
  - MIXED_DRAW
  - UNKNOWN

holdout_policy:
  unreleased_2027_actual_results:
    families:
      - preference_antlerless_deer
      - preference_antlerless_elk
      - preference_doe_pronghorn
    rule: hold out from scoring until official public draw results are released; do not mark held-out rows as prediction failures.

special_code_policy:
  bonus_point_purchase_only_codes:
    codes:
      - BER
      - BIS
      - BPU
      - DBS
      - DEE
      - DHL
      - ELK
      - GDR
      - GOA
      - MOO
      - PRO
      - RMB
    rule: valid 2026 bonus-point-only purchase codes; not hunt codes, not scorable draw-result rows, and not required as Research Page hunt runtime rows.
  cougar_current_open_season:
    forward_code: CG9999
    rule: collapse individual CG reporting/unit codes to CG9999 for current cougar open season; terminate individual CG codes for carry-forward runtime.
  terminated_2026_codes:
    EA1287:
      rule: no longer exists as a current 2026 Research runtime hunt code; terminate unless a source-backed crosswalk is added.

runtime_safety_rules:
  no_prediction_output_as_actual_truth: true
  no_target_year_actual_leakage: true
  probabilities_decimal_range: [0, 1]
  percents_range: [0, 100]
  availability_only_probability: null
  every_drop_requires_reason: true
  runtime_greater_than_feeder_requires_approved_reference_expansion: true

required_audit_outputs:
  - ENGINE_RESEARCH_PAGE_CANONICAL_CONTRACT_AUDIT.md
  - CANONICAL_COUNT_BLOCK.csv
  - FEEDER_TRUTH_SOURCE_AUDIT.csv
  - CANONICAL_TRUTH_UNIVERSE_SUMMARY.csv
  - SCORABLE_TRUTH_ROWS.csv
  - UNSCORABLE_TRUTH_ROWS.csv
  - ENGINE_INPUT_COVERAGE_AUDIT.csv
  - ENGINE_DROPPED_HUNT_CODES_DETAIL.csv
  - RUNTIME_OUTPUT_VALIDATION.csv
  - WEBSITE_METRIC_DISPLAY_MAP.csv
  - PROMOTION_READINESS.md
  - TEST_RESULTS.txt

promotion_status_values:
  - PROMOTION_READY
  - PASS_WITH_REPAIR_CANDIDATES
  - FAIL_BLOCKED

count_block:
  source: CANONICAL_COUNT_BLOCK.csv generated by tools/validate_research_page_canonical_contract.py
  fields:
    - canonical_truth_rows
    - canonical_truth_unique_hunt_codes
    - canonical_scorable_rows
    - canonical_scorable_unique_hunt_codes
    - reference_database_rows
    - reference_database_unique_hunt_codes
    - engine_feeder_rows
    - engine_feeder_unique_hunt_codes
    - runtime_output_rows
    - runtime_output_unique_hunt_codes
    - public_research_rows
    - public_research_unique_hunt_codes
    - dropped_truth_to_feeder_hunt_codes
    - dropped_feeder_to_runtime_hunt_codes
    - repair_candidates
    - blockers
